<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop Lab | Oslo Vibe Coding</title><link rel="stylesheet" href="../shared/base.css"><style>main{max-width:1120px;margin:auto;padding:55px 28px}header{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}h1{font-size:48px;margin:50px 0 20px}p{max-width:880px;color:var(--muted);line-height:1.6}label{display:block;margin:24px 0 9px}select{max-width:100%;width:520px;padding:14px;background:var(--paper);color:var(--ink);border:0;font:inherit}button{margin:24px 0}pre{padding:25px;border-top:2px solid var(--ember);background:#ffffff08;white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.55 Mono,monospace;min-height:300px}nav{display:flex;gap:25px;flex-wrap:wrap;margin-top:25px}small{color:var(--muted)}@media(max-width:600px){h1{font-size:34px}pre{font-size:14px}}</style></head><body><main><header><b>Oslo Vibe Coding / AI 101</b><a href="../index.html">Weekly materials</a></header><h1 id="title"></h1><p id="description"></p><label for="case">Scenario</label><select id="case"></select><br><button id="run" class="button">Run local check</button><pre id="output" aria-live="polite"></pre><small>All results come from local JavaScript and sample data. No AI model, cloud service, payment, or deployment runs here.</small><nav><a href="../project/index.html" target="_blank" rel="noopener">Open Studio Launch</a><a href="../first-page/index.html" target="_blank" rel="noopener">Open plain checkpoint</a><a href="core.js">Inspect the lab code</a></nav></main><script src="core.js"></script><script>const params=new URLSearchParams(location.search);const key=WorkshopLab.definitions[params.get('lab')]?params.get('lab'):'filter';const definition=WorkshopLab.definitions[key];document.querySelector('#title').textContent=definition.title;document.querySelector('#description').textContent=definition.description;definition.cases.forEach((name,i)=>{const option=document.createElement('option');option.value=i;option.textContent=name;document.querySelector('#case').append(option);});function run(){document.querySelector('#output').textContent=JSON.stringify(WorkshopLab.run(key,Number(document.querySelector('#case').value)),null,2);}document.querySelector('#run').addEventListener('click',run);run();</script></body></html>
